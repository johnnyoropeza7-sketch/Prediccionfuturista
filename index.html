rules_version='2';service cloud.firestore{match /databases/{db}/documents{
match /keys/{k}{
 allow get:if true;
 allow update:if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['device'])&&resource.data.device==null;
 allow read,write:if request.auth!=null;}
match /words/{k}{
 allow get:if true;
 allow create,update:if request.resource.data.keys().hasOnly(['w','n'])&&request.resource.data.w is string&&request.resource.data.w.size()<60;}
}}

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none}
.scr{position:fixed;inset:0;display:none;background:#000;overflow:hidden}
.scr.on{display:block}
.pill{background:rgba(40,40,40,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:999px;height:48px;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:17px}
.circ{width:48px;padding:0}
.cen{display:flex;flex-direction:column;gap:12px;padding:28vh 28px 0}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#1c1c1e;color:#fff;font-size:17px}
.big{background:#0a84ff;border-radius:12px;padding:14px;font-weight:600}
.btn{background:#2c2c2e;border-radius:10px;padding:9px 12px}
.btn.big{background:#0a84ff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid #222}
.row small{opacity:.6;flex:1}
#gh{position:absolute;top:0;left:0;right:0;z-index:3;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;display:flex;align-items:center;gap:8px;background:linear-gradient(#000c,#0000)}
#gh h1{margin:0;font-size:34px;flex:1}
#gr{position:absolute;inset:0;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;align-content:start;padding:calc(env(safe-area-inset-top) + 74px) 0 110px}
.c{aspect-ratio:1;position:relative;overflow:hidden;background:#222}
.c img,.c video{width:100%;height:100%;object-fit:cover;display:block}
.c span{position:absolute;right:5px;bottom:3px;font-size:13px;text-shadow:0 0 4px #000}
#gb{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:space-between}
#gb .tabs{display:flex;gap:4px;padding:5px}
#gb .tabs button{padding:10px 22px;border-radius:999px;font-size:15px}
#gb .tabs .a{background:rgba(255,255,255,.14);color:#0a84ff}
#st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#w{position:relative;container-type:inline-size}
#v{width:100%;height:100%;display:block}
#im{max-width:100%;max-height:100%}
#ov{position:absolute;white-space:nowrap;line-height:1;touch-action:none;pointer-events:none}
#vtop{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
#vt{flex-direction:column;height:52px;line-height:1.15;font-size:17px}
#vt small{font-size:13px}
#cb{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 84px);height:60px;gap:12px}
#pp{font-size:20px;width:28px}
#pt{flex:1;height:8px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}
#pf{height:100%;width:0;background:#fff}
#vb{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:space-between}

 const send=async w=>{

}

/* ---------- Claves (Firebase) ---------- */
async function checkKey(k){
 const ref=db.collection('keys').doc(k);
 return db.runTransaction(async t=>{
  const s=await t.get(ref);if(!s.exists)return 'Clave no válida';
  const d=s.data();if(d.revoked)return 'Clave revocada';
  if(!d.device){t.update(ref,{device:dev});return ''}
  return d.device===dev?'':'Esta clave es de otro dispositivo';
 });
}
async function enter(k){
 $('#le').textContent='';
 try{const e=await checkKey(k);if(e){$('#le').textContent=e;localStorage.removeItem('pfk');return}}
 catch(x){if(localStorage.pfk!==k){$('#le').textContent='Sin conexión o Firebase sin configurar';return}}

}

/* ---------- Almacenamiento local (videos y fotos de cada usuario) ---------- */
const idb=new Promise((r,j)=>{const q=indexedDB.open('pf',1);q.onupgradeneeded=()=>q.result.createObjectStore('m',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=async(m,f)=>{const d=await idb;return new Promise((r,j)=>{const t=d.transaction('m',m);const o=f(t.objectStore('m'));t.oncomplete=()=>r(o.result);t.onerror=j})};
const all=()=>tx('readonly',s=>s.getAll()),put=o=>tx('readwrite',s=>s.put(o)),del=id=>tx('readwrite',s=>s.delete(id));

/* ---------- Galería ---------- */
function thumb(f,vid){
 return new Promise(res=>{
  const u=URL.createObjectURL(f),el=document.createElement(vid?'video':'img');let fin=0;
  const end=v=>{if(fin)return;fin=1;URL.revokeObjectURL(u);res(v)};
  const done=()=>{try{
   const w=vid?el.videoWidth:el.naturalWidth,h=vid?el.videoHeight:el.naturalHeight,k=Math.min(1,320/Math.max(w,h)),c=document.createElement('canvas');
   c.width=Math.max(1,w*k|0);c.height=Math.max(1,h*k|0);c.getContext('2d').drawImage(el,0,0,c.width,c.height);
   const d=vid?el.duration:0;c.toBlob(b=>end(b?{b,d}:null),'image/jpeg',.7)}catch(x){end(null)}};
  el.onerror=()=>end(null);setTimeout(()=>end(null),8000);
  if(vid){el.muted=true;el.playsInline=true;el.preload='auto';el.onloadeddata=()=>{el.currentTime=Math.min(.1,(el.duration||1)/2)};el.onseeked=done}else el.onload=done;
  el.src=u;
 });
}

async function openGallery(){
 show('gl');urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
 const items=(await all()).sort((a,b)=>a.date-b.date),g=$('#gr');g.innerHTML='';
 const mk=b=>{const u=URL.createObjectURL(b);urls.push(u);return u};
 const fmt=d=>{const s=Math.round(d||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 const cell=(it,b,d)=>`<img src="${mk(b)}">`+(it.type=='v'?`<span>${fmt(d)}</span>`:'');
 const pend=[];
 items.forEach(it=>{
  const c=document.createElement('div');c.className='c';
  if(it.thumb)c.innerHTML=cell(it,it.thumb,it.dur);
  else{if(it.type=='v')c.innerHTML=`<video src="${mk(it.blob)}#t=0.1" muted playsinline preload="metadata"></video>`;pend.push([it,c])}
  c.onclick=()=>openViewer(it,mk(it.blob));
  g.append(c);
 });
 g.scrollTop=g.scrollHeight;
 for(const [it,c] of pend){
  const t=await thumb(it.blob,it.type=='v');if(!t||!t.b)continue;
  it.thumb=t.b;it.dur=t.d;await put(it);
  if($('#gl').classList.contains('on'))c.innerHTML=cell(it,t.b,t.d);
 }
}

/* ---------- Palabras clave ---------- */
const KW=()=>({a:localStorage.kwa||'pensaste',b:localStorage.kwb||'cierto'});
const nz=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
const like=(a,b)=>!!a&&!!b&&lev(a,b)<=(b.length>=7?2:b.length>=4?1:0);
function parse(txt){
 const k=KW(),A=k.a.split(/\s+/).map(nz).filter(Boolean),B=k.b.split(/\s+/).map(nz).filter(Boolean);
 const raw=txt.trim().split(/\s+/),t=raw.map(nz);let res=null;
 const at=(i,P)=>P.every((w,x)=>like(t[i+x],w));
 for(let i=0;i<t.length;i++){
  if(!at(i,A))continue;
  for(let j=i+A.length+1;j<t.length&&j<=i+A.length+9;j++){
   if(at(j,B)){let w=raw.slice(i+A.length,j);if(w.length>1&&nz(w[0])=='en')w=w.slice(1);res=w.join(' ');i=j+B.length-1;break}
  }
 }
 return res;
}
function kwPrev(){$('#kp').textContent='Ejemplo: "'+$('#ka').value.trim()+' barco '+$('#kb').value.trim()+'"'}
function kwOpen(){const k=KW();$('#ka').value=k.a;$('#kb').value=k.b;kwPrev();$('#kw').hidden=false}
$('#ka').oninput=$('#kb').oninput=kwPrev;

/* ---------- Voz: "pensaste ... cierto" ---------- */
const MIC=()=>localStorage.mic||'on';
let want=false,from=0,lastLen=0,lastFin=true;
function stopListen(){want=false;try{rec&&rec.stop()}catch(e){}}
function listen(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R||want||MODE()=='complice')return;
 want=true;from=0;lastLen=0;lastFin=true;rec=new R();rec.lang='es-ES';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
 rec.onresult=e=>{
  lastLen=e.results.length;lastFin=e.results[lastLen-1].isFinal;
  if(!V.paused||editing)return;
  for(let a=0;a<3;a++){
   let t='';for(let i=from;i<e.results.length;i++){const r=e.results[i];t+=(r[a]||r[0]).transcript+' '}
   const w=parse(t);if(w){setWord(w);break}
  }
 };
 rec.onend=()=>{if(live&&want&&(MIC()=='on'||V.paused))try{rec.start()}catch(e){}};
 try{rec.start()}catch(e){}
}
const micLabel=()=>'Micrófono: '+(MIC()=='on'?'siempre encendido':'solo en pausa');
function micToggle(){localStorage.mic=MIC()=='on'?'pause':'on';if(live){if(MIC()=='on')listen();else if(!V.paused)stopListen()}}
let trec;
function micTest(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition,k=KW();
 $('#mt').hidden=false;$('#mr').textContent='';
 $('#mx').textContent=R?'Escuchando… di "'+k.a+' barco '+k.b+'"':'Este navegador no tiene reconocimiento de voz. Abre la app en Safari.';
 if(!R)return;
 trec=new R();trec.lang='es-ES';trec.continuous=true;trec.interimResults=true;
 trec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';$('#mx').textContent=t;const w=parse(t);$('#mr').textContent=w?'✔ Detectado: '+w:''};
 trec.onerror=e=>{$('#mr').style.color='#ff453a';$('#mr').textContent=e.error=='not-allowed'?'Permiso de micrófono denegado':'Error: '+e.error};
 trec.onend=()=>{if(!$('#mt').hidden)try{trec.start()}catch(e){}};
 try{trec.start()}catch(e){}
}
$('#mc').onclick=()=>{$('#mt').hidden=true;try{trec&&trec.abort()}catch(e){}};

/* ---------- Editor de la pizarra ---------- */
const FONTS=['Caveat','Kalam','Permanent Marker','Reenie Beanie','Shadows Into Light','Indie Flower','Patrick Hand','Rock Salt','Gloria Hallelujah','Covered By Your Grace','Nanum Pen Script','Homemade Apple','Architects Daughter','Just Another Hand','Zeyada','Handlee','Schoolbell','Gochi Hand','Amatic SC','Cabin Sketch','Londrina Sketch','Special Elite','Dancing Script','Pacifico','Bangers','Satisfy'];
const COL=['#1a1a1a','#ffffff','#1d4ed8','#06b6d4','#16a34a','#facc15','#ea580c','#dc2626','#ec4899','#7c3aed','#92400e','#6b7280'];
const FM0={c:'n',b:0,i:0,u:0,sp:0};
const cl=v=>Math.min(100,Math.max(0,v));
const mkb=(par,txt,fn,cls)=>{const b=document.createElement('button');b.className=cls||'btn';b.textContent=txt;b.onclick=fn;par.append(b);return b};
FONTS.forEach(n=>{const b=mkb($('#fc'),n,()=>{dr.font=n;ref()},'');b.style.fontFamily=`"${n}",cursive`;b.dataset.f=n});
[['n','Aa'],['u','AA'],['l','aa']].forEach(([k,t])=>{const b=mkb($('#fm'),t,()=>{dr.fmt.c=k;ref()});b.dataset.c=k});
[['b','N','font-weight:700'],['i','K','font-style:italic'],['u','S','text-decoration:underline']].forEach(([k,t,st])=>{const b=mkb($('#fm'),t,()=>{dr.fmt[k]=dr.fmt[k]?0:1;ref()});b.style.cssText=st;b.dataset.k=k});
COL.forEach(c=>{const b=mkb($('#ec'),'',()=>{dr.color=c;ref()},'');b.style.cssText=`width:34px;height:34px;border-radius:50%;background:${c};border:2px solid #fff6`;b.dataset.col=c});
['marcador','rotulador','lapiz','tiza','spray'].forEach(t=>{const b=mkb($('#et'),t=='lapiz'?'Lápiz':cap(t),()=>{dr.tool=t;ref()});b.dataset.t=t});
$('#ecu').oninput=e=>{dr.color=e.target.value;ref()};

$('#er').oninput=e=>{dr.tilt=+e.target.value;ref()};
$('#ep').oninput=e=>{dr.p=+e.target.value;ref()};

$('#em').onclick=()=>{dr.t=V.currentTime;ref()};
function hold(btn,dx,dy){
 let iv,t0;const go=()=>{const st=Date.now()-t0>500?1.5:.5;dr.x=cl(dr.x+dx*st);dr.y=cl(dr.y+dy*st);ref()};
 btn.onpointerdown=e=>{e.preventDefault();t0=Date.now();go();clearInterval(iv);iv=setInterval(go,60)};
 ['onpointerup','onpointerleave','onpointercancel'].forEach(ev=>btn[ev]=()=>clearInterval(iv));
}
hold($('#du'),0,-1);hold($('#dd'),0,1);hold($('#dl'),-1,0);hold($('#drt'),1,0);
document.querySelectorAll('#ed .tabs .btn').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#ed .tabs .btn').forEach(x=>x.classList.toggle('on',x==b));
 document.querySelectorAll('#ed .pg').forEach(p=>p.hidden=p.id!=b.dataset.p);
});
function ref(){
 sty(O,dr,$('#eto').value||'Predicción');
 $('#em').textContent='Marcar momento ('+dr.t.toFixed(1)+'s)';
 document.querySelectorAll('#fc button').forEach(b=>b.classList.toggle('on',b.dataset.f==dr.font));
 document.querySelectorAll('#fm button').forEach(b=>b.classList.toggle('on',b.dataset.c?b.dataset.c==dr.fmt.c:!!dr.fmt[b.dataset.k]));
 document.querySelectorAll('#et button').forEach(b=>b.classList.toggle('on',b.dataset.t==dr.tool));
 document.querySelectorAll('#ec button').forEach(b=>b.style.borderColor=b.dataset.col==dr.color?'#fff':'#fff6');
}
function edit(){
 V.pause();editing=true;
 dr=Object.assign({x:50,y:50,size:12,font:'Caveat',color:'#1a1a1a',tool:'marcador',tilt:0,p:0,t:V.currentTime},cur.cfg||{});
 dr.fmt=Object.assign({},FM0,dr.fmt||{});
 $('#es').value=dr.size;$('#er').value=dr.tilt;$('#ep').value=dr.p||0;$('#esp').value=dr.fmt.sp;
 if(/^#[0-9a-f]{6}$/i.test(dr.color))$('#ecu').value=dr.color;
 $('#ed').hidden=false;O.hidden=false;$('#w').style.touchAction='none';ref();layoutEd(true);
}
function layoutEd(on){const h=on?$('#ed').offsetHeight:0,t=$('#st').style;t.top=on?'calc(env(safe-area-inset-top) + 64px)':'';t.bottom=on?(h+72)+'px':'';$('#cb').style.bottom=on?(h+8)+'px':'';fit()}
function closeEd(){editing=false;$('#ed').hidden=true;O.hidden=true;O.style.padding='0';O.style.outline='none';$('#w').style.touchAction='';layoutEd(false)}
$('#ex').onclick=closeEd;
$('#eg').onclick=async()=>{cur.cfg=JSON.parse(JSON.stringify(dr));await put(cur);closeEd()};
let pd=null;const W=$('#w');
W.onpointerdown=e=>{if(!editing)return;pd=[e.clientX,e.clientY];W.setPointerCapture(e.pointerId);e.preventDefault()};
W.onpointermove=e=>{if(!editing||!pd)return;const r=W.getBoundingClientRect();dr.x=cl(dr.x+(e.clientX-pd[0])/r.width*100);dr.y=cl(dr.y+(e.clientY-pd[1])/r.height*100);pd=[e.clientX,e.clientY];ref()};
W.onpointerup=W.onpointercancel=()=>{pd=null};
